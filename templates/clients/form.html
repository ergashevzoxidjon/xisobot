{% extends "base.html" %}
{% set src = form or client %}
{% block content %}
<div class="page-header">
  <div>
    <h3>{{ 'Mijozni tahrirlash' if client else 'Yangi mijoz' }}</h3>
    <div class="subtitle">Mijoz ma'lumotlarini kiriting</div>
  </div>
</div>
<div class="card p-4" style="max-width:520px">
<form method="post">
  {{ csrf() }}
  <div class="mb-3">
    <label class="form-label">Ism / Tashkilot nomi</label>
    <input class="form-control" name="name" value="{{ src.name if src else '' }}" required autofocus maxlength="150">
  </div>
  <div class="mb-3">
    <label class="form-label">Telefon</label>
    <input class="form-control" name="phone" value="{{ src.phone if src else '' }}" placeholder="+998 90 123 45 67" maxlength="50">
  </div>
  <div class="mb-3">
    <label class="form-label">Manzil</label>
    <input class="form-control" name="address" value="{{ src.address if src else '' }}" maxlength="255">
  </div>
  <div class="mb-4">
    <label class="form-label">Izoh</label>
    <textarea class="form-control" name="notes" rows="3">{{ src.notes if src else '' }}</textarea>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Saqlash</button>
    <a href="{{ url_for('clients.client_detail', client_id=client.id) if client else url_for('clients.list_clients') }}"
       class="btn btn-outline-secondary">Bekor qilish</a>
  </div>
</form>
</div>
{% endblock %}
