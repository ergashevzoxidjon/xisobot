{% extends "base.html" %}
{% set src = form or order_type %}
{% block content %}
<div class="page-header">
  <div>
    <h3>{{ 'Turni tahrirlash' if order_type else 'Yangi buyurtma turi' }}</h3>
    <div class="subtitle">Standart narx buyurtma yaratishda avtomatik qo'yiladi (keyin o'zgartirish mumkin)</div>
  </div>
</div>
<div class="card p-4" style="max-width:480px">
<form method="post">
  {{ csrf() }}
  <div class="mb-3">
    <label class="form-label">Nomi</label>
    <input class="form-control" name="name" required autofocus maxlength="100"
           placeholder="Vizitka, Banner, Buklet..." value="{{ src.name if src else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">O'lchov birligi</label>
    <input class="form-control" name="unit" maxlength="20" placeholder="dona, metr, dasta"
           value="{{ src.unit if src else 'dona' }}">
  </div>
  <div class="mb-4">
    <label class="form-label">Standart narx (so'm)</label>
    <input type="number" step="0.01" min="0" class="form-control" name="default_price"
           value="{{ src.default_price if src else 0 }}">
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Saqlash</button>
    <a href="{{ url_for('settings.order_types') }}" class="btn btn-outline-secondary">Bekor qilish</a>
  </div>
</form>
</div>
{% endblock %}
