{% extends "base.html" %}
{% block title %}Kirish · Poligrafiya Hisobot Tizimi{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:85vh">
  <div style="width:100%; max-width:380px;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center mb-2"
           style="width:56px;height:56px;border-radius:16px;background:var(--primary-soft);">
        <i class="bi bi-printer-fill" style="font-size:1.6rem;color:var(--primary);"></i>
      </div>
      <h4 class="fw-bold mb-0">Poligrafiya tizimi</h4>
      <div class="text-muted small">Hisobot va buyurtmalar boshqaruvi</div>
    </div>
    <div class="card p-4">
      <form method="post">
        {{ csrf() }}
        <div class="mb-3">
          <label class="form-label">Login</label>
          <input type="text" name="username" class="form-control" required autofocus placeholder="masalan: admin">
        </div>
        <div class="mb-4">
          <label class="form-label">Parol</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-1"></i> Kirish
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
