{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <h3>Parolni o'zgartirish</h3>
    <div class="subtitle">{{ current_user.display_name }} · {{ role_label(current_user.role) }}</div>
  </div>
</div>
<div class="card p-4" style="max-width:460px">
<form method="post">
  {{ csrf() }}
  <div class="mb-3">
    <label class="form-label">Joriy parol</label>
    <input type="password" class="form-control" name="current_password" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label">Yangi parol</label>
    <input type="password" class="form-control" name="new_password" required minlength="6">
    <div class="form-text">Kamida 6 ta belgi.</div>
  </div>
  <div class="mb-4">
    <label class="form-label">Yangi parolni tasdiqlang</label>
    <input type="password" class="form-control" name="confirm_password" required minlength="6">
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary"><i class="bi bi-check-lg"></i> O'zgartirish</button>
  </div>
</form>
</div>
{% endblock %}
