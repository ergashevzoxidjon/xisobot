{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh">
  <div class="text-center" style="max-width:420px">
    <div class="d-inline-flex align-items-center justify-content-center mb-3"
         style="width:64px;height:64px;border-radius:18px;background:#fef3f2;">
      <i class="bi bi-exclamation-triangle-fill" style="font-size:1.8rem;color:#f04438;"></i>
    </div>
    <div class="fw-bold text-muted mb-1">{{ code }}</div>
    <h4 class="fw-bold mb-2">{{ title }}</h4>
    <p class="text-muted">{{ message }}</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-2">
      <i class="bi bi-house"></i> Bosh sahifaga qaytish</a>
  </div>
</div>
{% endblock %}
